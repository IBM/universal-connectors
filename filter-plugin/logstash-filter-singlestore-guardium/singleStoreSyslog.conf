input {
	tcp {
		port => <PORT_NUMBER>
		type => "syslog"
		# Datasource Tag, given on the input. The filter compares it with the Tag of the rsyslog imfile input,
		# which arrives in the event as the APP-NAME of the syslog header.
		tags => ["singlestore-audit"]
		# Keep [host] as the IP address of the sender. With the default (true), [host] is the DNS name,
		# which is not a valid server IP.
		dns_reverse_lookup_enabled => false
		# ssl_enabled => true
		# ssl_certificate => "${SSL_DIR}/tls.crt"
		# ssl_key => "${SSL_DIR}/tls.key"
		# Uncomment the ssl_key_passphrase line for Guardium Data Protection v12.2.3 (or patch 5008) and above to use encrypted private keys
		# ssl_key_passphrase => "${ssl_key_passphrase}"
		# ssl_client_authentication => "none"
	}
}

filter {
	if [type] == "syslog" {

		grok {
			match => {
				"message" => "^<%{POSINT}>%{INT}\s+%{NOTSPACE}\s+%{NOTSPACE}\s+%{NOTSPACE:syslog_app}\s+-\s+-\s+-\s+(?:serverHostname=%{NOTSPACE:serverHostname}\s+)?(?:serverPort=%{INT}\s+)?(?<message>\d+,[\s\S]*)$"
			}
			overwrite => ["message"]
			tag_on_failure => ["_singlestore_syslog_parse_failure"]
		}

		if "_singlestore_syslog_parse_failure" in [tags] {
			drop { }
		}

		# The Tag from the event log (APP-NAME) must be the Datasource Tag of the input.
		if [syslog_app] not in [tags] {
			drop { }
		}

		mutate {
			gsub => [
				"message", '\\\\n', " ",
				"message", "#012", " "
			]
		}

		if [message] =~ /^0,/ or [message] =~ /^[^,]*,C(?:,|$)/ or [message] =~ /^(?:[^,]*,){7}(?:,|$)/ or [message] =~ /^(?:[^,]*,){7}distributed(?:,|$)/ or [message] =~ /^(?:[^,]*,){8}\[unknown\](?:,|$)/ {
			drop { }
		}

		if [host][ip] {
			mutate {
				add_field => { "serverIP" => "%{[host][ip]}" }
			}
		} else if [host] {
			mutate {
				add_field => { "serverIP" => "%{host}" }
			}
		}

		singlestoredb_guardium_filter{}

		mutate {
			remove_field => ["syslog_app"]
		}
	}
}
