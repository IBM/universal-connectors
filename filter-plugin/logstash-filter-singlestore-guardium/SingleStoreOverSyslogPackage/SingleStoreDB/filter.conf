filter {
    if [type] == "syslog" and "guc_filter_param_datasource_tag" in [tags] {

        # rsyslog template (SingleStoreAuditFormat) produces:
        #   <PRI>1 TIMESTAMP HOSTNAME APP-NAME - - - [serverHostname=X] [serverPort=N] <SingleStore CSV audit line>
        # Strip the syslog header and keep only the CSV line in [message], so that the
        # message has the same format as the one received over Filebeat.
        # serverHostname is optional; when absent the filter plug-in falls back to the hostname in the CSV line.
        grok {
            match => {
                "message" => "^<%{POSINT}>%{INT}\s+%{NOTSPACE}\s+%{NOTSPACE}\s+%{NOTSPACE}\s+-\s+-\s+-\s+(?:serverHostname=%{NOTSPACE:serverHostname}\s+)?(?:serverPort=%{INT}\s+)?(?<message>\d+,[\s\S]*)$"
            }
            overwrite => ["message"]
            tag_on_failure => ["_singlestore_syslog_parse_failure"]
        }

        if "_singlestore_syslog_parse_failure" in [tags] {
            drop { }
        }

        # rsyslog escapes embedded new lines. SingleStore ends each wrapped line with "\", so the
        # new line arrives as "\\n" (or "#012" when control characters are escaped).
        # Replace them with a space. The escaped comma "\," is left untouched.
        mutate {
            gsub => [
                "message", '\\\\n', " ",
                "message", "#012", " "
            ]
        }

        # Drop the same events as the Filebeat package:
        #   field 0 == "0", field 1 == "C", field 7 (user) empty or "distributed", field 8 (database) == "[unknown]"
        if [message] =~ /^0,/ or [message] =~ /^[^,]*,C(?:,|$)/ or [message] =~ /^(?:[^,]*,){7}(?:,|$)/ or [message] =~ /^(?:[^,]*,){7}distributed(?:,|$)/ or [message] =~ /^(?:[^,]*,){8}\[unknown\](?:,|$)/ {
            drop { }
        }

        # serverIP is the address of the host that sent the syslog message over TCP.
        if [host][ip] {
            mutate {
                add_field => { "serverIP" => "%{[host][ip]}" }
            }
        } else if [host] {
            mutate {
                add_field => { "serverIP" => "%{host}" }
            }
        }

        singlestoredb_guardium_filter{}
    }
}
