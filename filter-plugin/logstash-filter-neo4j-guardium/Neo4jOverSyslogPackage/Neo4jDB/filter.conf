filter {
     if [type] == "neo4j" {
        # Parse RFC5424 syslog format with priority code
        # Format: <pri>timestamp hostname tag neo4j_timestamp log_level metadata...
        grok {
            match => {
                "message" => "<%{POSINT:syslog_pri}>%{TIMESTAMP_ISO8601:syslog_timestamp}\s+%{SYSLOGHOST:server_hostname}\s+%{DATA:source_program}\s+(%{TIMESTAMP_ISO8601:ts})\s+%{LOGLEVEL:log_level}\s+(?<metadata1>[^\\\t]*)[\t\s]+(?<protocol>[^\s]*)\s+(?<driverVersion>[^ \t]*)\t*(?<client_ip>[^ \t]*)\t*(?<server_ip>[^ >]*)\>?\t*(?<dbname>[^\s+]*)\s+\-\s+(%{USERNAME:dbuser})?\s+\-\s+%{GREEDYDATA:queryStatement}"
            }
        }
        
        if "_grokparsefailure" in [tags]
        {
           drop{}
        }

        # Filter out system queries
        if[queryStatement] =~ "type: \'system\'" or [queryStatement] =~ "runtime=system" or [dbname] =~ "system"
        {
            drop {}
        }

        # Parse syslog timestamp (ISO8601 format from rsyslog)
        date {
          match => [ "syslog_timestamp", "ISO8601" ]
        }
        
        mutate {
            add_field => { "serverHostName" => "%{server_hostname}" }
        }

        neodb_guardium_filter{}

        if "_neoguardium_json_parse_error" not in [tags] {
            mutate { remove_field => ["message","syslog_timestamp","source_program","syslog_pri","server_hostname","metadata1", "client_ip", "ts","log_level", "queryStatement", "dbuser", "server_ip", "driverVersion", "protocol", "@timestamp", "@version", "sequence", "dbname", "host", "log"] }
        }
    }
}
